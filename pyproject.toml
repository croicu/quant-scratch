[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-scratch"
version = "0.1.0"
description = "A collection of short, self-contained experiments — each backed by its own CLI tool — for validating or invalidating assumptions about signals and correlations across financial market parameters. Findings and strategies are presented in quant-research (https://github.com/croicu/quant-research)."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "yfinance>=0.2.28",
    "matplotlib>=3.9",
]

[project.scripts]
stock-quote = "stock_quote.cli:main"
day-chart = "day_chart.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
